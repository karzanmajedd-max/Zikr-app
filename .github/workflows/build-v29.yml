name: Build and test Zikrakan v2.9 - Floating DND Sound
on:
  push:
    branches: [main]
    paths:
      - 'v29/**'
      - '.github/workflows/build-v29.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore original resources and apply fix
        run: |
          mkdir -p buildsrc
          base64 -d v27/Zikrakan_v27_source_b64.txt | xz -d | tar xf - -C buildsrc
          python3 v29/fix.py
          grep -q 'quickFloating' buildsrc/app/src/main/assets/index.html
      - name: Check WebView JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('buildsrc/app/src/main/assets/index.html').read_text()
          chunks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          assert chunks
          Path('buildsrc/ui-check.js').write_text('\n'.join(chunks))
          PY
          node --check buildsrc/ui-check.js
      - name: Compile application and Android tests
        working-directory: buildsrc
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Save APK for review
        uses: actions/upload-artifact@v4
        with:
          name: Zikrakan-v2.9-Built-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=android-sdk"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test notifications on Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r buildsrc/app/build/outputs/apk/debug/app-debug.apk
            adb install -r buildsrc/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant com.zikr.zikrakan android.permission.POST_NOTIFICATIONS
            adb shell appops set com.zikr.zikrakan SYSTEM_ALERT_WINDOW allow
            adb shell appops get com.zikr.zikrakan SYSTEM_ALERT_WINDOW
            adb shell am instrument -w -r com.zikr.zikrakan.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/zikr_tests.txt
            grep -q 'OK (3 tests)' /tmp/zikr_tests.txt
      - name: Publish tested APK
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp buildsrc/app/build/outputs/apk/debug/app-debug.apk Zikrakan_v2.9_Tested.apk
          gh release create zikrakan-v2.9 Zikrakan_v2.9_Tested.apk --title "Zikrakan v2.9 - notifications verified on Android emulator" --notes "Fixes: a real HIGH-priority system notification is always sent even when overlay permission is granted; optional overlay supplements rather than replaces it; no duplicated manual sound/vibration; overlay error diagnostic; separate normal notification channel with banner disabled. Compiled and passed Android 35 integration tests. Actual POCO/HyperOS behavior still requires device-side verification. Debug signing key differs between CI runs: back up user data before uninstalling older versions." --latest=false || gh release upload zikrakan-v2.9 Zikrakan_v2.9_Tested.apk --clobber

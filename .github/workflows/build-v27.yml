name: Build Zikrakan v2.7 APK
on:
  push:
    branches: [main]
    paths:
      - 'v27/**'
      - '.github/workflows/build-v27.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore Zikrakan source
        run: |
          mkdir -p buildsrc
          base64 -d v27/Zikrakan_v27_source_b64.txt | xz -d | tar xf - -C buildsrc
          test -f buildsrc/app/src/main/assets/index.html
          test -f buildsrc/app/src/main/java/com/zikr/zikrakan/Notifier.kt
      - name: Build debug APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare named APK
        run: cp buildsrc/app/build/outputs/apk/debug/app-debug.apk Zikrakan_v2.7_Fixed.apk
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zikrakan-v2.7-Fixed-APK
          path: Zikrakan_v2.7_Fixed.apk
          retention-days: 30
      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create zikrakan-v2.7 Zikrakan_v2.7_Fixed.apk --title "Zikrakan v2.7 - notification banner fix" --notes "Android debug APK. New notification channels and an optional user-authorized overlay banner for POCO/HyperOS devices. Permissions for notifications, overlay and exact alarms are controlled by the user. Because this build uses a new signing key, back up existing app data before uninstalling older releases." --latest=false || gh release upload zikrakan-v2.7 Zikrakan_v2.7_Fixed.apk --clobber
